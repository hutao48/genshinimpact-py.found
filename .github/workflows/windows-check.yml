name: Windows 合并验证与打包

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: 安装版与免安装版
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: 安装固定版本的构建依赖
        run: python -m pip install -r packaging/requirements-build.txt

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $appVersion = (python -c "import app_version; print(app_version.APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $appVersion) { throw "无法读取版本号" }
          "version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: 准备 Inno Setup 6
        shell: pwsh
        run: |
          $found = (Get-Command iscc -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup 安装失败" }
          }

      - name: 回归测试、打包与成品界面检查
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python

      - name: 上传 Windows 安装版与免安装版
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ steps.version.outputs.version }}-x64
          path: |
            dist/GenshinInstrumentDetector-*-win64-portable.exe
            dist/GenshinInstrumentDetector-*-win64-setup.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30

      - name: 保留成品界面检查报告与截图
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-gui-check-${{ github.run_id }}
          path: |
            build/gui-self-test-*.json
            build/gui-self-test-*.png
          if-no-files-found: ignore
          retention-days: 7
