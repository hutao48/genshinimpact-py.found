plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.genshin.detector'
    compileSdk 35

    defaultConfig {
        applicationId "com.genshin.detector"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "1.0.2"
    }

    // 发布签名：设置了环境变量 ANDROID_KEYSTORE_FILE / ANDROID_KEYSTORE_PASSWORD /
    // ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（GitHub Actions 中来自仓库 Secrets）时用正式密钥；
    // 未设置时退回调试密钥签名，保证 release APK 仍可直接安装
    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

configurations {
    all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
